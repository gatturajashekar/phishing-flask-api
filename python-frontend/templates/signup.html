<!DOCTYPE html>
<html>
<head>
<title>Create Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  padding: 40px;
  border-radius: 20px;
  width: 380px;
  max-width: 95%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
  font-weight: 500;
}

/* MESSAGE */
.message {
  text-align: center;
  margin-bottom: 15px;
  font-size: 14px;
  min-height: 20px;
}

.error {
  color: #f87171;
}

.success {
  color: #34d399;
}

/* INPUT */
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 14px;
}

input::placeholder {
  color: #cbd5e1;
}

/* PASSWORD STRENGTH */
.strength {
  font-size: 12px;
  margin-top: -5px;
  margin-bottom: 10px;
  height: 14px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(90deg, #3b82f6, #6366f1);
  color: white;
  transition: 0.3s ease;
}

button:hover {
  opacity: 0.9;
  transform: translateY(-2px);
}

button:disabled {
  background: #475569;
  cursor: not-allowed;
}

/* LINK */
a {
  display: block;
  text-align: center;
  margin-top: 18px;
  font-size: 14px;
  color: #cbd5e1;
  text-decoration: none;
  transition: 0.2s ease;
}

a:hover {
  color: white;
}
</style>
</head>

<body>

<div class="card">

<h2>🛡 Create Secure Account</h2>

<p id="message" class="message"></p>

<form id="signupForm">
  <input name="email" placeholder="Email address" required>
  <input id="password" name="password" type="password" placeholder="Password (min 6 chars)" required>
  <div id="strengthText" class="strength"></div>
  <input name="confirm_password" type="password" placeholder="Confirm Password" required>
  <button id="signupBtn" type="submit">Create Account</button>
</form>

<a href="login.html">Already have an account?</a>

</div>

<script>
const passwordInput = document.getElementById("password");
const strengthText = document.getElementById("strengthText");

passwordInput.addEventListener("input", function() {
  const value = passwordInput.value;

  if (value.length < 6) {
    strengthText.textContent = "Weak password";
    strengthText.style.color = "#f87171";
  } else if (value.length < 10) {
    strengthText.textContent = "Medium strength";
    strengthText.style.color = "#fbbf24";
  } else {
    strengthText.textContent = "Strong password";
    strengthText.style.color = "#34d399";
  }
});

document.getElementById("signupForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = e.target.email.value.trim().toLowerCase();
  const password = e.target.password.value;
  const confirm = e.target.confirm_password.value;
  const message = document.getElementById("message");
  const button = document.getElementById("signupBtn");

  message.textContent = "";
  message.className = "message";

  if (password !== confirm) {
    message.textContent = "Passwords do not match";
    message.classList.add("error");
    return;
  }

  button.disabled = true;
  button.textContent = "Creating account...";

  try {
    const res = await fetch("http://localhost:3000/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      message.textContent = "Signup successful! You can now login.";
      message.classList.add("success");
      e.target.reset();
      strengthText.textContent = "";
    } else {
      message.textContent = data.message || "Signup failed";
      message.classList.add("error");
    }

  } catch (err) {
    message.textContent = "Server error";
    message.classList.add("error");
  }

  button.disabled = false;
  button.textContent = "Create Account";
});
</script>

</body>
</html>
