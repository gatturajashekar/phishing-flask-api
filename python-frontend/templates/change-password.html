<!DOCTYPE html>
<html>
<head>
<title>Change Password</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 12px;
  width: 350px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.message {
  text-align: center;
  margin-bottom: 10px;
}

.error { color: red; }
.success { color: green; }

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 10px;
  background: #333;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover { background: black; }
</style>
</head>

<body>

<div class="card">
  <h2>Change Password</h2>
  <p id="message" class="message"></p>

  <form id="changeForm">
    <input name="oldPassword" type="password" placeholder="Old Password" required>
    <input name="newPassword" type="password" placeholder="New Password" required>
    <input name="confirmPassword" type="password" placeholder="Confirm New Password" required>
    <button type="submit">Confirm</button>
  </form>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "login.html";

document.getElementById("changeForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const oldPassword = e.target.oldPassword.value;
  const newPassword = e.target.newPassword.value;
  const confirmPassword = e.target.confirmPassword.value;
  const message = document.getElementById("message");

  message.textContent = "";
  message.className = "message";

  if (newPassword.length < 6) {
    message.textContent = "New password must be at least 6 characters.";
    message.classList.add("error");
    return;
  }

  if (newPassword !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    message.classList.add("error");
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/change-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ oldPassword, newPassword })
    });

    const data = await res.json();

    if (res.ok) {
      message.textContent = data.message;
      message.classList.add("success");

      setTimeout(() => {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }, 1200);
    } else {
      message.textContent = data.message;
      message.classList.add("error");
    }

  } catch {
    message.textContent = "Server error.";
    message.classList.add("error");
  }
});
</script>

</body>
</html>
