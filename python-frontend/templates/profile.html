<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
}

/* NAVBAR */
.navbar {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 18px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar div {
  font-weight: 600;
}

.navbar span {
  cursor: pointer;
  font-size: 18px;
  transition: 0.2s ease;
}

.navbar span:hover {
  transform: scale(1.1);
}

/* CONTAINER */
.container {
  min-height: calc(100vh - 80px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  padding: 40px;
  border-radius: 20px;
  width: 420px;
  max-width: 95%;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
}

h2 {
  text-align: center;
  margin-bottom: 30px;
  font-weight: 500;
}

/* SECTION */
.section {
  margin-bottom: 25px;
}

.section h3 {
  margin-bottom: 10px;
  font-size: 15px;
  color: #cbd5e1;
}

/* INFO BOX */
.info {
  background: rgba(255,255,255,0.1);
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  margin-bottom: 10px;
  word-break: break-all;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: 0.2s ease;
  background: linear-gradient(90deg, #3b82f6, #6366f1);
  color: white;
}

button:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.secondary {
  background: #475569;
}

.secondary:hover {
  background: #334155;
}

/* DIVIDER */
.divider {
  height: 1px;
  background: rgba(255,255,255,0.15);
  margin: 25px 0;
}
</style>
</head>

<body>

<div class="navbar">
  <div>🛡 Phishing Detector</div>
  <span onclick="goHome()">🏠 Home</span>
</div>

<div class="container">
  <div class="card">

    <h2>My Profile</h2>

    <div class="section">
      <h3>Account Information</h3>
      <div class="info" id="emailInfo">Loading...</div>
      <button onclick="changePassword()">Change Password</button>
    </div>

    <div class="divider"></div>

    <div class="section">
      <h3>Activity</h3>
      <button onclick="viewHistory()">View Analysis History</button>
    </div>

    <div class="divider"></div>

    <div class="section">
      <button class="secondary" onclick="logout()">Logout</button>
    </div>

  </div>
</div>

<script>
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login.html";
}

async function loadProfile() {
  try {
    const res = await fetch("http://localhost:3000/profile", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (!res.ok) throw new Error();

    const data = await res.json();
    document.getElementById("emailInfo").textContent = data.email;

  } catch {
    localStorage.removeItem("token");
    window.location.href = "login.html";
  }
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

function goHome() {
  window.location.href = "home.html";
}

function viewHistory() {
  alert("History feature coming next.");
}

function changePassword() {
  window.location.href = "change-password.html";
}

loadProfile();
</script>

</body>
</html>
